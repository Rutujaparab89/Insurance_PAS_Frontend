<div class="mb-4">
  <h2 class="fw-bold mb-1">Customer Dashboard</h2>
  <p class="text-muted">Manage your insurance policies, premiums and claims.</p>
</div>

<div class="row g-4">
  @for (card of cards; track card.title) {
    <div class="col-12 col-md-6 col-xl-4">
      <a class="card dashboard-action-card shadow-sm border-0 h-100 text-decoration-none"
         [routerLink]="card.path"
         [attr.aria-label]="card.title">
        <div class="card-body p-4">
          <i class="bi fs-2 text-primary" [class]="card.icon"></i>
          <h5 class="fw-semibold mt-3 text-dark">{{ card.title }}</h5>
          @if (card.title === 'Customer Registration') {
            <p class="text-muted small mb-0">Register your customer details.</p>
          }
        </div>
      </a>
    </div>
  }
</div>
